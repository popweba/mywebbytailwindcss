<!doctype html>
<html lang="en">
  <!-- +++++++++++++++ ส่วนของ HEAD +++++++++++++++ -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio - Kankangwal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Monomaniac+One&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    
    <!-- แก้ไข: เพิ่ม https:// หน้า cdn.tailwindcss.com -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- ตั้งค่าการใช้งาน Google Font กับ TailwindCSS -->
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              monomaniac: ["Monomaniac One", "sans-serif"],
            },
          },
        },
      };
    </script>
  </head>

  <!-- +++++++++++++++ ส่วนของ BODY +++++++++++++++ -->
  <body class="bg-black text-white min-h-screen">
    
    <!-- ส่วนของ Nav Bar -->
    <div class="flex flex-col md:flex-row items-center justify-between mt-8 mx-4 md:mx-[150px] gap-6">
        <!-- เมนูด้านซ้าย -->
        <div class="w-full flex justify-center md:justify-start gap-4">
            <a href="#" class="text-white font-monomaniac text-2xl hover:text-[#01D5A2] transition-colors">Portfolio</a>
            <a href="#" class="text-white font-monomaniac text-2xl hover:text-[#01D5A2] transition-colors">About Me</a>
            <a href="#" class="text-white font-monomaniac text-2xl hover:text-[#01D5A2] transition-colors">Get In Touch</a>
        </div>

        <!-- รูป hero ตรงกลาง -->
        <div class="w-full flex justify-center">
            <!-- ตรวจสอบชื่อโฟลเดอร์ภาพให้ถูกต้อง (เช่น ./images/ หรือ ./imges/) -->
            <img src="./imges/hello1.png" alt="hello1" class="w-[75px]">
        </div>

        <!-- เมนูไอคอนด้านขวา -->
        <div class="w-full flex justify-center md:justify-end gap-4">
            <a href="#" class="text-white text-2xl hover:text-[#01D5A2] transition-colors"><i class="bi bi-github"></i></a>
            <a href="#" class="text-white text-2xl hover:text-[#01D5A2] transition-colors"><i class="bi bi-instagram"></i></a>
            <a href="#" class="text-white text-2xl hover:text-[#01D5A2] transition-colors"><i class="bi bi-twitter"></i></a>
            <a href="#" class="text-white text-2xl hover:text-[#01D5A2] transition-colors"><i class="bi bi-linkedin"></i></a>
        </div>
    </div>

    <!-- ส่วนของ ข้อความตรงกลางหน้าจอ -->
    <div class="flex flex-col items-center text-center gap-4 md:gap-7 mt-[80px] md:mt-[120px] px-4">
        <span class="text-white font-monomaniac text-3xl md:text-5xl">Kankangwal Minkaew</span>
        <span class="text-[#01D5A2] font-monomaniac text-3xl md:text-5xl">Freelance Web Devleoper</span>
        <span class="text-white font-monomaniac text-3xl md:text-5xl">Base In THAILAND</span>
    </div>

    <!-- ส่วนของ รูปด้านล่าง -->
    <div class="flex justify-center mt-[60px] md:mt-[80px] pb-12">
        <img src="./imges/person1.png" alt="person1"
             class="w-[250px] md:w-[300px] border-[5px] border-[#01D5A2] rounded-full p-3 object-cover">
    </div>

  </body>
</html>
