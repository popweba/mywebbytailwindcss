<!doctype html>
<html lang="en">

  <head>

    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Monomaniac+One&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <!-- ตั้งค่าการใช้งาน TailwindCSS  -->
    <script src="http://cdn.tailwindcss.com"></script>
    <!-- ตั้งค่าการใช้งาน Google Font กับ TailwindCSS -->
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              monomaniac: ["Monomaniac One"],
            },
          },
        },
      };
    </script>
  </head>

    <div class="flex items-center mt-8 mx-[150px]">

        <span class="text-white  font-monomaniac text-5xl">Base In THAILAND</span>
